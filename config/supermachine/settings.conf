# SuperMachine user defaults. Edit the installed copy at
# ~/.config/supermachine/settings.conf for machine-specific choices.

SUPERMACHINE_PRIMARY_MONITOR="HDMI-A-0"
SUPERMACHINE_SECONDARY_MONITOR="HDMI-A-1-1"
SUPERMACHINE_SECONDARY_ROTATION="left"
SUPERMACHINE_SECONDARY_WIDTH="1080"

SUPERMACHINE_WINDOW_GAP="20"
SUPERMACHINE_SMART_PLACE_POLL="1.5"
SUPERMACHINE_WALLPAPER="$HOME/Pictures/wallpapers/wallpaper-blur.png"
