[colors]
background = #d912151b
foreground = #e8e8e8
muted = #8f96a3
accent = #8aadf4

[bar/home]
width = 100%
height = 32
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
modules-left = home xworkspaces
modules-center = date
modules-right = settings-app codex wired
cursor-click = pointer
enable-ipc = true

[module/home]
type = custom/text
format = 󰋜
format-foreground = ${colors.accent}

[module/xworkspaces]
type = internal/xworkspaces
# Openbox exposes one shared set of desktops across both XRandR outputs.
# Pinning them to a monitor can therefore hide every workspace on this bar.
pin-workspaces = false
enable-click = true
enable-scroll = true
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = #ed8796
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %A, %B %d
time = %I:%M %p
label = %date%  %time%

[module/wired]
type = internal/network
interface = enp8s0
interval = 3
label-connected = 󰈀  connected
label-connected-foreground = ${colors.foreground}
label-disconnected = 󰈂  offline
label-disconnected-foreground = ${colors.muted}

[module/codex]
type = custom/text
content = 󰚩
content-foreground = ${colors.accent}
content-padding = 1
click-left = ~/.config/eww/scripts/codex-usage.sh toggle

[module/settings-app]
type = custom/text
content = 󰒓
content-foreground = ${colors.accent}
content-padding = 1
click-left = ~/.config/supermachine-settings/launch.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
